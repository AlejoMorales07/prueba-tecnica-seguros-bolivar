spring:
  application:
    name: prueba-tecnica-polizas
  datasource:
    url: jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  core-mock:
    url: http://localhost:8080/core-mock/evento

logging:
  level:
    root: INFO
    com.segurosbolivar.polizas: DEBUG
